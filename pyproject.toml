[project]
name = "fuse"
version = "0.1.0"
description = "A personal AI agent with memory, tools, approvals and proactive triggers."
readme = "README.md"
authors = [
    { name = "Pranit Deshpande", email = "71553492+pranitdeshpande98@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "fastembed>=0.9.1",
    "google-api-python-client>=2.202.0",
    "google-auth-oauthlib>=1.5.0",
    "langchain-openai>=1,<2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "python-telegram-bot[job-queue]>=22,<23",
    "tzdata>=2026.6 ; sys_platform == 'win32'",
]
[project.scripts]
fuse-bot = "fuse.channels.telegram_bot:main"
fuse-worker = "fuse.tasks.worker:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs a running service (e.g. Postgres)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
