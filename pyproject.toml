[project]
name = "fuse"
version = "0.1.0"
description = "A personal AI agent with memory, tools, approvals and proactive triggers."
readme = "README.md"
authors = [
    { name = "Pranit Deshpande", email = "71553492+pranitdeshpande98@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "python-telegram-bot>=22,<23",
]
[project.scripts]
fuse-bot = "fuse.channels.telegram_bot:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running service (e.g. Postgres)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
